services:
  db:
    image: postgres:16
    container_name: finanzas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finanzas
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: finanzas-api
    restart: unless-stopped
    ports:
      - "5009:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Host=db;Database=finanzas;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    container_name: finanzas-ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./ai-service/.env

volumes:
  db_data: